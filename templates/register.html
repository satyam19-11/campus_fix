{% extends "base.html" %}
{% block title %}Create account - CampusFix{% endblock %}
{% block content %}
<h1>Create a student account</h1>
<form method="post" class="stack">
  <label for="name">Full name</label><input id="name" name="name" required>
  <label for="email">Email</label><input id="email" name="email" type="email" required>
  <label for="password">Password (6+ characters)</label><input id="password" name="password" type="password" minlength="6" required>
  <p><button type="submit">Create account</button> &nbsp;<a href="{{ url_for('login') }}">Back to sign in</a></p>
</form>
{% endblock %}
