{% extends "base.html" %}
{% block title %}Report an issue - CampusFix{% endblock %}
{% block content %}
<h1>Report an issue</h1>
<p class="sub">Tell us what is broken and where. A ticket is created straight away.</p>
<form method="post" class="stack">
  <label for="category_id">Category</label>
  <select id="category_id" name="category_id" required>
    <option value="">Choose one</option>
    {% for c in cats %}<option value="{{ c.category_id }}">{{ c.category_name }}</option>{% endfor %}
  </select>
  <label for="location">Location</label>
  <input id="location" name="location" placeholder="Hostel Block B, Room 204" required>
  <label for="description">What is wrong?</label>
  <textarea id="description" name="description" required></textarea>
  <p><button type="submit">Submit complaint</button></p>
</form>
{% endblock %}
